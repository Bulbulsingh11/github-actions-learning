name: Python CI

on:
  push:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pytest

      - name: Run tests
        run: pytest

      - name: Access secret
        run: |
          echo "Secret length: ${#TEST_SECRET}"
        env:
          TEST_SECRET: ${{ secrets.TEST_SECRET }}

